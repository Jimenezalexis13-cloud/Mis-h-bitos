<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Habits V7</title>
<style>
*{box-sizing:border-box}
html{background:#0b0b0b}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{border:0;color:inherit;background:none;cursor:pointer}
button:active{transform:scale(.98)}
.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px calc(104px + env(safe-area-inset-bottom))}
h1,h2,p{margin:0}
h1{font-size:42px;line-height:1.02;letter-spacing:-1.6px}
h2{font-size:27px;line-height:1.1;letter-spacing:-.7px}
.muted{color:#8d8d8d}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px}
.add{border:1px solid #383838;border-radius:14px;padding:11px 14px;white-space:nowrap;transition:.18s}
.add:active{background:#1b1b1b}
.card{border:1px solid #292929;border-radius:20px;padding:18px;margin-bottom:14px;background:#111}
.today-card{padding:20px}
.status-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.percent{font-size:22px;font-weight:700;letter-spacing:-.5px}
.progress{height:9px;background:#292929;border-radius:99px;overflow:hidden;margin:15px 0 10px}
.bar{height:100%;background:#f5f5f5;width:0;transition:width .35s ease}
#summary{font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card{margin:0}
.num{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.habit{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:15px;border:1px solid #292929;border-radius:15px;margin-top:9px;background:#111;transition:background .18s,border-color .18s,transform .12s}
.habit:hover{border-color:#3b3b3b}
.check{width:34px;height:34px;border:1px solid #444;border-radius:10px;display:grid;place-items:center;flex:none;transition:.2s}
.habit.done .check{background:#f5f5f5;color:#111;border-color:#f5f5f5;animation:checkPop .22s ease-out}
.habit.done .name{text-decoration:line-through;color:#777}
@keyframes checkPop{0%{transform:scale(.82)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,11,.96);border-top:1px solid #292929;display:flex;justify-content:center;gap:8px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(12px)}
.tabs button{padding:11px 18px;border-radius:12px;color:#888;transition:.18s}
.tabs button.active{background:#1b1b1b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;color:#777;font-size:12px;padding:5px}
.day{aspect-ratio:1;border:1px solid #292929;border-radius:10px;display:grid;place-items:center;font-size:13px;transition:.15s}
.day.done{background:#f5f5f5;color:#111;border-color:#f5f5f5}
.day.today{outline:1px solid #777;outline-offset:1px}
.day:active{transform:scale(.96)}
.hidden{display:none!important}
.empty{text-align:center;padding:30px;color:#888}
.primary{background:#f5f5f5;color:#111;border-radius:12px;padding:11px 15px;margin-top:15px;transition:.18s}
input{width:100%;padding:14px;background:#151515;color:#fff;border:1px solid #333;border-radius:12px;font-size:16px;margin-top:8px;outline:none}
input:focus{border-color:#666}
.manage-actions{display:flex;gap:8px;margin-left:10px;flex:none}
.manage-btn{border:1px solid #333;background:#151515;color:#f5f5f5;border-radius:10px;padding:9px 12px;font-size:14px}
.manage-btn.edit{color:#fff}
.manage-btn.delete{color:#aaa}
.manage-card{align-items:center}
@media(max-width:390px){
  h1{font-size:37px}
  .tabs button{padding:11px 14px}
  .manage-btn{padding:9px 10px}
}
</style></head><body><div class="app">
<section id="home"><div class="top"><div><div class="muted" id="date"></div><h1>Buenos días.</h1></div><button class="add" onclick="addHabit()">+ Hábito</button></div>
<div class="card today-card" id="todayCard"><div class="status-row"><div><div class="muted">Hoy</div><h2 id="message" style="margin-top:5px">Vamos.</h2></div><div class="percent" id="percent">0%</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="muted" id="summary"></div></div><div id="habitList"></div></section>
<section id="calendar" class="hidden"><div class="top"><div><div class="muted">CONSTANCIA</div><h1>Calendario</h1></div></div><div class="stat"><div class="card"><div class="muted">Racha actual</div><div class="num" id="streak">0</div></div><div class="card"><div class="muted">Días cumplidos</div><div class="num" id="daysDone">0</div></div></div>
<div class="stat" style="margin-top:10px"><div class="card"><div class="muted">Mejor racha</div><div class="num" id="bestStreak">0</div></div><div class="card"><div class="muted">Constancia</div><div class="num" id="consistency">0%</div></div></div><div class="card" style="margin-top:14px"><div class="top" style="margin-bottom:14px"><button onclick="prevMonth()">‹</button><strong id="month"></strong><button onclick="nextMonth()">›</button></div><div class="grid" id="cal"></div></div></section>
<section id="manage" class="hidden"><div class="top"><div><div class="muted">PERSONALIZA</div><h1>Mis hábitos</h1></div></div><div class="card"><div class="muted">Agregar hábito</div><input id="newHabit" placeholder="Ej. Leer 20 minutos"><button class="primary" onclick="addFromInput()">Agregar</button></div><div id="manageList"></div></section></div>
<nav class="tabs"><button class="active" onclick="show('home',this)">Hoy</button><button onclick="show('calendar',this)">Calendario</button><button onclick="show('manage',this)">Hábitos</button></nav>

<script>
const KEY="myhabits-v6";
const OLD_KEY="myhabits-v2";
const uid=()=>`h-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=key(new Date());

const DEFAULT_HABITS=["Entrenamiento","Tomar agua","Leer 20 minutos","Dormir a tiempo"];

function migrate(){
  const current=JSON.parse(localStorage.getItem(KEY)||"null");
  if(current && Array.isArray(current.habits)){
    // V6 ya existe: normaliza por seguridad.
    current.habits=current.habits.map(h=>typeof h==="string"?{id:uid(),name:h}:h).filter(h=>h&&h.id&&h.name);
    current.archive=current.archive||{};
    current.habits.forEach(h=>current.archive[h.id]=h.name);
    current.days=current.days||{};
    localStorage.setItem(KEY,JSON.stringify(current));
    return current;
  }

  const old=JSON.parse(localStorage.getItem(OLD_KEY)||"null");
  const habits=(old?.habits?.length?old.habits:DEFAULT_HABITS).map(name=>({id:uid(),name:String(name)}));
  const archive={};
  habits.forEach(h=>archive[h.id]=h.name);
  const days={};

  if(old?.days){
    Object.entries(old.days).forEach(([date,states])=>{
      const ids=habits.map(h=>h.id);
      const out={habitIds:ids,states:{}};
      Object.entries(states||{}).forEach(([index,value])=>{
        const i=Number(index);
        if(Number.isInteger(i) && habits[i] && value===true) out.states[habits[i].id]=true;
      });
      if(Object.keys(out.states).length || Object.keys(states||{}).length){
        days[date]=out;
      }
    });
  }

  // Also migrate V1's "today" if V2 history is absent.
  if(old?.today && !days[todayKey]){
    const ids=habits.map(h=>h.id), states={};
    Object.entries(old.today).forEach(([index,value])=>{
      const i=Number(index);
      if(Number.isInteger(i) && habits[i] && value===true) states[habits[i].id]=true;
    });
    days[todayKey]={habitIds:ids,states};
  }

  const fresh={habits,archive,days};
  localStorage.setItem(KEY,JSON.stringify(fresh));
  return fresh;
}

let data=migrate();
let viewDate=new Date();

function save(){localStorage.setItem(KEY,JSON.stringify(data));}

function activeIds(){return data.habits.map(h=>h.id);}

function ensureToday(){
  if(!data.days[todayKey]){
    data.days[todayKey]={habitIds:activeIds(),states:{}};
  }else if(!Array.isArray(data.days[todayKey].habitIds)){
    data.days[todayKey].habitIds=activeIds();
    data.days[todayKey].states=data.days[todayKey].states||{};
  }
  return data.days[todayKey];
}

function getDay(k){
  return data.days[k] || null;
}

function dayHabitIds(k){
  const d=getDay(k);
  if(d && Array.isArray(d.habitIds)) return d.habitIds;
  return activeIds();
}

function dayStates(k){
  const d=getDay(k);
  return d?.states || {};
}

function pct(k){
  const ids=dayHabitIds(k);
  if(!ids.length)return 0;
  const states=dayStates(k);
  const done=ids.reduce((n,id)=>n+(states[id]===true?1:0),0);
  return Math.round(done/ids.length*100);
}

function complete(k){return pct(k)>=80;}

function greeting(){
  const h=new Date().getHours();
  return h<12?"Buenos días.":h<19?"Buenas tardes.":"Buenas noches.";
}
function updateHeader(){
  document.getElementById("date").textContent=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  document.querySelector("#home h1").textContent=greeting();
}
updateHeader();

function renderHome(){
  const l=document.getElementById("habitList");
  l.innerHTML="";
  const x=ensureToday().states;

  data.habits.forEach(h=>{
    const on=x[h.id]===true;
    const b=document.createElement("button");
    b.className="habit"+(on?" done":"");
    b.onclick=()=>{
      const d=ensureToday();
      d.states[h.id]=!on;
      save(); render();
    };
    b.innerHTML=`<span class="check">${on?"✓":""}</span><span class="name">${escapeHtml(h.name)}</span>`;
    l.appendChild(b);
  });

  const p=pct(todayKey);
  const done=data.habits.reduce((n,h)=>n+(x[h.id]===true?1:0),0);
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("percent").textContent=p+"%";
  document.getElementById("summary").textContent=`${done} de ${data.habits.length} hábitos cumplidos`;
  document.getElementById("message").textContent=
    p>=100?"Día completo. Te cumpliste.":
    p>=80?"Felicidades. Lo bueno dominó.":
    p>=50?"No fue perfecto. Pero avanzaste.":
    p>0?"Hoy no salió completo. Mañana continúa.":"Vamos.";
  document.getElementById("todayCard").classList.toggle("complete",p>=80);
}

function renderCalendar(){
  const y=viewDate.getFullYear(),m=viewDate.getMonth(),c=document.getElementById("cal");
  c.innerHTML="";
  document.getElementById("month").textContent=viewDate.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  ["D","L","M","M","J","V","S"].forEach(x=>{
    const e=document.createElement("div");e.className="dow";e.textContent=x;c.appendChild(e);
  });
  for(let i=0;i<new Date(y,m,1).getDay();i++)c.appendChild(document.createElement("div"));
  for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
    const dt=new Date(y,m,d),k=key(dt),e=document.createElement("button");
    e.className="day"+(complete(k)?" done":"")+(k===todayKey?" today":"");
    e.textContent=d;e.onclick=()=>showDayDetail(k);c.appendChild(e);
  }
  updateStats();
}

function updateStats(){
  const completedDates=Object.keys(data.days).filter(k=>complete(k)).sort();
  const count=completedDates.length;

  let current=0,d=new Date();
  while(complete(key(d))){current++;d.setDate(d.getDate()-1);}

  let best=0,run=0,prev=null;
  completedDates.forEach(k=>{
    if(prev){
      const a=new Date(prev+"T12:00:00"),b=new Date(k+"T12:00:00");
      const diff=Math.round((b-a)/86400000);
      run=diff===1?run+1:1;
    }else run=1;
    best=Math.max(best,run);prev=k;
  });

  const recordedDates=Object.keys(data.days).filter(k=>{
    const d=data.days[k];
    return d && Array.isArray(d.habitIds) && d.habitIds.length>0;
  });
  const totalDays=Math.max(1,recordedDates.length);
  const consistency=Math.round(count/totalDays*100);

  document.getElementById("daysDone").textContent=count;
  document.getElementById("streak").textContent=current;
  document.getElementById("bestStreak").textContent=best;
  document.getElementById("consistency").textContent=consistency+"%";
}

function renderManage(){
  const b=document.getElementById("manageList");
  b.innerHTML="";
  data.habits.forEach(h=>{
    const e=document.createElement("div");
    e.className="habit manage-card";
    e.innerHTML=`
      <span class="name" style="flex:1">${escapeHtml(h.name)}</span>
      <div class="manage-actions">
        <button class="manage-btn edit" onclick="editHabit('${h.id}')">Editar</button>
        <button class="manage-btn delete" onclick="removeHabit('${h.id}')">Eliminar</button>
      </div>`;
    b.appendChild(e);
  });
}

function addHabit(){
  const h=prompt("¿Qué hábito quieres agregar?");
  if(h?.trim()){
    const habit={id:uid(),name:h.trim()};
    data.habits.push(habit);
    data.archive[habit.id]=habit.name;
    // If today has already been registered, include the new habit in today's denominator.
    if(data.days[todayKey] && Array.isArray(data.days[todayKey].habitIds)){
      data.days[todayKey].habitIds.push(habit.id);
    }
    save();render();
  }
}

function addFromInput(){
  const e=document.getElementById("newHabit"),name=e.value.trim();
  if(name){
    const habit={id:uid(),name};
    data.habits.push(habit);
    data.archive[habit.id]=habit.name;
    if(data.days[todayKey] && Array.isArray(data.days[todayKey].habitIds)){
      data.days[todayKey].habitIds.push(habit.id);
    }
    e.value="";save();render();
  }
}

function editHabit(id){
  const habit=data.habits.find(h=>h.id===id);
  if(!habit)return;
  const name=prompt("Editar hábito:",habit.name);
  if(name?.trim()){
    habit.name=name.trim();
    data.archive[id]=habit.name;
    save();render();
  }
}

function removeHabit(id){
  const habit=data.habits.find(h=>h.id===id);
  if(!habit)return;
  if(confirm(`¿Eliminar "${habit.name}"?`)){
    data.habits=data.habits.filter(h=>h.id!==id);
    // Keep archive/history intact. Only remove it from today's active snapshot.
    const today=data.days[todayKey];
    if(today?.habitIds){
      today.habitIds=today.habitIds.filter(x=>x!==id);
      delete today.states[id];
    }
    save();render();
  }
}

function prevMonth(){viewDate.setMonth(viewDate.getMonth()-1);renderCalendar();}
function nextMonth(){viewDate.setMonth(viewDate.getMonth()+1);renderCalendar();}

function show(id,b){
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  render();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){renderHome();renderCalendar();renderManage();}
render();
</script>
<div id="dayDetail" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;padding:22px 18px;display:flex;align-items:flex-end;justify-content:center">
  <div class="card" style="width:min(520px,100%);margin:0;max-height:82vh;overflow:auto">
    <div class="top" style="margin-bottom:14px">
      <div>
        <div class="muted">RESUMEN DEL DÍA</div>
        <h2 id="detailDate" style="margin-top:4px"></h2>
      </div>
      <button onclick="closeDayDetail()" style="font-size:24px;color:#888">×</button>
    </div>
    <div class="card" style="margin:0 0 12px">
      <div class="muted">Cumplimiento</div>
      <div class="num" id="detailPct">0%</div>
    </div>
    <div id="detailList"></div>
  </div>
</div>


<script>
function showDayDetail(k){
  const d=new Date(k+"T12:00:00");
  const ids=dayHabitIds(k);
  const states=dayStates(k);
  const p=pct(k);

  document.getElementById("detailDate").textContent=d.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("detailPct").textContent=p+"%";

  const list=document.getElementById("detailList");
  list.innerHTML="";
  if(!ids.length){
    list.innerHTML='<div class="empty">No había hábitos.</div>';
  }else{
    ids.forEach(id=>{
      const name=data.archive[id] || data.habits.find(h=>h.id===id)?.name || "Hábito";
      const done=states[id]===true;
      const e=document.createElement("div");
      e.className="habit"+(done?" done":"");
      e.style.cursor="default";
      e.innerHTML=`<span class="check">${done?"✓":""}</span><span class="name">${escapeHtml(name)}</span>`;
      list.appendChild(e);
    });
  }
  document.getElementById("dayDetail").classList.remove("hidden");
}
function closeDayDetail(){document.getElementById("dayDetail").classList.add("hidden");}
</script></body></html>
